<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grimoire</title>
<meta name="description" content="Grimoire: an offline music library. Your MP3s and MP4s, saved on your device.">
<meta name="theme-color" content="#060405">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grimoire">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060405; --panel:#0e090b; --panel2:#150e11; --elev:#1d1418; --elev2:#271a1f;
  --line:rgba(255,235,240,.08); --line2:rgba(255,235,240,.14);
  --text:#f6eef0; --mute:#b3a3a8; --dim:#76666b;
  --crimson:#e0162b; --crimson-deep:#7a0a17; --gold:#d6a640; --violet:#8f45e0;
  --accent:var(--crimson); --accent-deep:var(--crimson-deep); --on-accent:#fff;
  --display:'Anton','Bebas Neue',Impact,'Haettenschweiler','Arial Narrow Bold','Avenir Next Condensed','Roboto Condensed',sans-serif-condensed,sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --r:10px; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --halftone:radial-gradient(circle, rgba(255,255,255,.16) 1px, transparent 1.6px);
}
[data-accent="violet"]{--accent:#9b4dee; --accent-deep:#3a0f63; --on-accent:#fff}
[data-accent="gold"]{--accent:#e0b04a; --accent-deep:#5a3f08; --on-accent:#140b02}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%; background:var(--bg); color:var(--text); font-family:var(--body); font-size:15px; overscroll-behavior:none}
body{overflow:hidden; -webkit-font-smoothing:antialiased}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
input,select{font:inherit; color:inherit}
img{display:block}
svg.i{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none}
svg.i.f{fill:currentColor; stroke:none}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
::-webkit-scrollbar{width:10px; height:10px} ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12); border-radius:10px; border:3px solid transparent; background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- App shell ---------- */
.app{position:fixed; inset:0; display:grid; grid-template-columns:clamp(260px,24vw,340px) 1fr; grid-template-rows:1fr auto; gap:8px; padding:8px 8px 0; padding-left:calc(8px + var(--sal)); padding-right:calc(8px + var(--sar))}
.side{grid-row:1; display:flex; flex-direction:column; gap:8px; min-height:0}
.panel{background:var(--panel); border-radius:var(--r); border:1px solid var(--line)}
.side-nav{padding:10px 8px}
.side-nav .brand{display:flex; align-items:center; gap:10px; padding:6px 12px 12px}
.brand-mark{width:30px; height:30px; border-radius:7px; background:url(icons/icon-192.png) center/cover, var(--crimson)}
.brand-word{font-family:var(--display); font-size:24px; letter-spacing:.06em; line-height:1}
.brand-word b{color:var(--accent); font-weight:400}
.nav-link{display:flex; align-items:center; gap:16px; width:100%; padding:10px 12px; border-radius:8px; font-weight:700; color:var(--mute); text-align:left}
.nav-link:hover{color:var(--text)} .nav-link.on{color:var(--text)}
.nav-link.on svg{color:var(--accent)}
.side-lib{flex:1; min-height:0; display:flex; flex-direction:column}
.lib-head{display:flex; align-items:center; gap:10px; padding:14px 14px 8px}
.lib-head h2{margin:0; font-size:15px; font-weight:800; flex:1; display:flex; gap:12px; align-items:center; color:var(--mute)}
.chips{display:flex; gap:8px; padding:4px 14px 10px; overflow-x:auto; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; padding:7px 13px; border-radius:999px; background:var(--elev); font-size:13px; font-weight:600; border:1px solid transparent}
.chip:hover{background:var(--elev2)}
.chip.on{background:var(--accent); color:var(--on-accent)}
.lib-tools{display:flex; align-items:center; justify-content:space-between; padding:0 14px 6px; color:var(--mute); font-size:13px}
.sortbtn{display:flex; align-items:center; gap:6px; color:var(--mute); font-size:13px; font-weight:600} .sortbtn:hover{color:var(--text)}
.lib-list{flex:1; overflow-y:auto; padding:0 6px 10px}
.li{display:flex; align-items:center; gap:12px; padding:7px 8px; border-radius:8px; width:100%; text-align:left}
.li:hover{background:var(--elev)} .li.on{background:var(--elev2)}
.li .cover{width:48px; height:48px; border-radius:5px}
.li.round .cover{border-radius:50%}
.li-t{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.li-s{font-size:13px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px}
.li-b{min-width:0; flex:1}
.li.playing .li-t{color:var(--accent)}

.main{grid-row:1; position:relative; min-height:0; overflow:hidden; background:var(--panel)}
.scroll{position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; scroll-behavior:auto}
.topbar{position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:8px; padding:12px 20px; background:transparent; transition:background .2s}
.topbar.solid{background:rgba(14,9,11,.92); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px)}
.topbar .spacer{flex:1}
.round-btn{width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:rgba(0,0,0,.55); color:var(--text)}
.round-btn:disabled{opacity:.35; cursor:default}
.pill{display:inline-flex; align-items:center; gap:8px; padding:9px 16px; border-radius:999px; font-weight:700; font-size:14px; background:var(--text); color:#0a0607}
.pill.ghost{background:rgba(0,0,0,.5); color:var(--text); border:1px solid var(--line2)}
.pill.accent{background:var(--accent); color:var(--on-accent)}
.pill:hover{filter:brightness(1.08); transform:scale(1.02)}
.topbar-title{font-family:var(--display); font-size:22px; letter-spacing:.03em; opacity:0; transition:opacity .2s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.topbar.solid .topbar-title{opacity:1}
.mobile-brand{display:none}
.content{padding:0 20px 40px}

/* ---------- Sections & cards ---------- */
.h-sec{display:flex; align-items:flex-end; justify-content:space-between; margin:28px 0 12px}
.h-sec h2{margin:0; font-family:var(--display); font-weight:400; font-size:26px; letter-spacing:.03em; text-transform:uppercase; line-height:1; display:flex; align-items:center; gap:10px}
.h-sec h2::before{content:""; width:6px; height:22px; background:var(--gold); transform:skewX(-14deg); display:inline-block}
.h-sec .more{font-size:13px; font-weight:700; color:var(--mute)} .h-sec .more:hover{color:var(--text); text-decoration:underline}
.greet{font-family:var(--display); font-size:clamp(30px,4vw,46px); letter-spacing:.02em; text-transform:uppercase; margin:6px 0 16px; line-height:1}
.greet span{color:var(--accent)}
.quick{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px}
.qt{position:relative; display:flex; align-items:center; gap:0; height:56px; background:rgba(255,255,255,.06); border-radius:6px; overflow:hidden; text-align:left; font-weight:700; font-size:14px}
.qt:hover{background:rgba(255,255,255,.12)}
.qt .cover{width:56px; height:56px; border-radius:0; flex:none}
.qt .qt-t{padding:0 12px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; flex:1}
.qt .playfab{position:static; width:34px; height:34px; margin-right:10px; opacity:0; transform:none}
.qt:hover .playfab{opacity:1}
.row-scroll{display:grid; grid-auto-flow:column; grid-auto-columns:clamp(150px,15vw,190px); gap:4px; overflow-x:auto; margin:0 -8px; padding:0 8px 6px; scrollbar-width:none}
.row-scroll::-webkit-scrollbar{display:none}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:4px; margin:0 -8px}
.card{position:relative; padding:10px; border-radius:8px; text-align:left; min-width:0}
.card:hover{background:var(--elev)}
.card .cover{width:100%; aspect-ratio:1; border-radius:6px; box-shadow:0 8px 24px rgba(0,0,0,.5)}
.card.round .cover{border-radius:50%}
.card-t{font-weight:700; margin-top:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.card-s{font-size:13px; color:var(--mute); margin-top:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.35}
.card .art{position:relative}
.playfab{position:absolute; right:8px; bottom:8px; width:46px; height:46px; border-radius:50%; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; box-shadow:0 8px 18px rgba(0,0,0,.55); opacity:0; transform:translateY(8px); transition:.2s}
.playfab svg{width:20px; height:20px}
.card:hover .playfab,.card:focus-within .playfab{opacity:1; transform:none}
.badge{position:absolute; left:8px; top:8px; font-family:var(--display); font-size:12px; letter-spacing:.08em; padding:2px 7px; background:var(--gold); color:#140b02; border-radius:3px}

/* covers */
.cover{position:relative; overflow:hidden; background:#1a1013; flex:none}
.cover img{width:100%; height:100%; object-fit:cover}
.cover.ph{display:grid; place-items:center; isolation:isolate}
.cover.ph::before{content:""; position:absolute; inset:0; background-image:var(--halftone); background-size:7px 7px; mix-blend-mode:overlay; opacity:.9; -webkit-mask-image:linear-gradient(135deg,transparent 25%,#000); mask-image:linear-gradient(135deg,transparent 25%,#000)}
.cover.ph::after{content:""; position:absolute; inset:7%; border:1px solid rgba(255,230,200,.28)}
.cover.ph span{position:relative; font-family:var(--display); color:rgba(255,245,240,.92); font-size:clamp(14px,38cqw,64px); letter-spacing:.02em; text-shadow:0 3px 0 rgba(0,0,0,.35); line-height:1}
.cover{container-type:inline-size}

/* ---------- Hero / collection header ---------- */
.hero{position:relative; margin:-62px -20px 0; padding:92px 20px 24px; display:flex; align-items:flex-end; gap:24px; background:linear-gradient(180deg, var(--hc,#5a0b16) 0%, color-mix(in srgb,var(--hc,#5a0b16) 55%, var(--panel)) 100%); overflow:hidden; isolation:isolate}
.hero::before{content:""; position:absolute; inset:0; background-image:var(--halftone); background-size:6px 6px; opacity:.5; -webkit-mask-image:radial-gradient(ellipse at 90% 0%,#000 0%,transparent 60%); mask-image:radial-gradient(ellipse at 90% 0%,#000 0%,transparent 60%); z-index:-1}
.hero .cover{width:clamp(140px,18vw,232px); aspect-ratio:1; border-radius:6px; box-shadow:0 18px 50px rgba(0,0,0,.6)}
.hero.round .cover{border-radius:50%}
.hero-meta{min-width:0; flex:1}
.hero-type{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.12em}
.hero h1{font-family:var(--display); font-weight:400; text-transform:uppercase; margin:6px 0 10px; font-size:clamp(34px,6.2vw,92px); line-height:.92; letter-spacing:.01em; word-break:break-word; text-shadow:0 4px 30px rgba(0,0,0,.35)}
.hero-sub{font-size:14px; color:rgba(255,255,255,.85); display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.hero-sub b{color:#fff}
.dot{opacity:.6}
.actions{display:flex; align-items:center; gap:18px; padding:22px 0 14px; position:relative}
.actions::before{content:""; position:absolute; inset:0 -20px; background:linear-gradient(180deg, color-mix(in srgb,var(--hc,#5a0b16) 30%, transparent), transparent); z-index:-1}
.bigplay{width:58px; height:58px; border-radius:50%; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; box-shadow:0 8px 24px rgba(0,0,0,.45); transition:transform .15s}
.bigplay:hover{transform:scale(1.05)}
.bigplay svg{width:26px; height:26px}
.icon-btn{width:40px; height:40px; display:grid; place-items:center; color:var(--mute); border-radius:50%}
.icon-btn:hover{color:var(--text)}
.icon-btn.on{color:var(--accent)}
.icon-btn.big svg{width:30px; height:30px}

/* ---------- Track rows ---------- */
.tracks{margin:0 -8px}
.thead,.row{display:grid; grid-template-columns:36px minmax(0,1.4fr) minmax(0,1fr) 40px 56px 40px; align-items:center; gap:12px; padding:0 10px}
.thead{height:36px; color:var(--mute); font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; border-bottom:1px solid var(--line); margin-bottom:8px}
.tracks.noalbum .thead,.tracks.noalbum .row{grid-template-columns:36px minmax(0,1fr) 40px 56px 40px}
.tracks.noalbum .row-album,.tracks.noalbum .th-album{display:none}
.row{min-height:58px; border-radius:6px; cursor:pointer; user-select:none; -webkit-user-select:none}
.row:hover{background:rgba(255,255,255,.06)}
.row-n{color:var(--mute); text-align:right; font-variant-numeric:tabular-nums; font-size:14px}
.row-main{display:flex; align-items:center; gap:12px; min-width:0}
.row .cover{width:42px; height:42px; border-radius:4px}
.row-text{min-width:0}
.row-title{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row-sub{font-size:13px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; display:flex; gap:6px; align-items:center}
.row-album{font-size:14px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row-dur{color:var(--mute); font-size:14px; text-align:right; font-variant-numeric:tabular-nums}
.row .icon-btn{width:34px; height:34px; opacity:0}
.row:hover .icon-btn,.row .icon-btn.on{opacity:1}
.row.playing .row-title{color:var(--accent)}
.tag{font-family:var(--display); font-size:10px; letter-spacing:.08em; padding:1px 5px; background:var(--gold); color:#140b02; border-radius:2px; flex:none}
.eq{display:inline-flex; gap:2px; height:14px; align-items:flex-end}
.eq i{width:3px; background:var(--accent); animation:eq 0.9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s} .eq i:nth-child(3){animation-delay:-.6s}
.is-paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}

/* ---------- Empty & misc ---------- */
.empty{position:relative; margin:-62px -20px 0; min-height:calc(100% + 62px); padding:110px 24px 60px; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; overflow:hidden; isolation:isolate; background:radial-gradient(ellipse at 80% 10%, rgba(224,22,43,.35), transparent 55%), radial-gradient(ellipse at 0% 100%, rgba(143,69,224,.18), transparent 50%)}
.empty::before{content:""; position:absolute; inset:0; background-image:var(--halftone); background-size:7px 7px; -webkit-mask-image:radial-gradient(ellipse at 85% 15%, #000, transparent 55%); mask-image:radial-gradient(ellipse at 85% 15%, #000, transparent 55%); z-index:-1}
.empty .kicker{font-weight:700; letter-spacing:.2em; color:var(--gold); font-size:12px; text-transform:uppercase}
.empty h1{font-family:var(--display); font-weight:400; font-size:clamp(48px,9vw,120px); line-height:.88; margin:10px 0 16px; text-transform:uppercase}
.empty h1 em{font-style:normal; color:var(--accent)}
.empty p{max-width:460px; color:var(--mute); line-height:1.55; margin:0 0 24px}
.empty .steps{display:grid; gap:10px; margin-top:34px; max-width:520px}
.empty .step{display:flex; gap:14px; align-items:flex-start; color:var(--mute); font-size:14px; line-height:1.45}
.empty .step b{font-family:var(--display); font-weight:400; color:var(--gold); font-size:20px; width:22px; flex:none; line-height:1}
.muted{color:var(--mute)}
.search-box{display:flex; align-items:center; gap:10px; background:var(--elev); border:1px solid var(--line2); border-radius:999px; padding:0 16px; height:46px; max-width:520px; flex:1}
.search-box:focus-within{border-color:var(--text); background:var(--elev2)}
.search-box input{flex:1; background:none; border:0; outline:0; font-size:15px; min-width:0}
.search-box input::placeholder{color:var(--dim)}
.genres{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:14px}
.genre{position:relative; aspect-ratio:1.7; border-radius:8px; overflow:hidden; padding:14px; text-align:left; font-family:var(--display); font-size:24px; text-transform:uppercase; line-height:1; isolation:isolate}
.genre::after{content:""; position:absolute; inset:0; background-image:var(--halftone); background-size:6px 6px; opacity:.6; z-index:-1; -webkit-mask-image:linear-gradient(135deg,transparent 40%,#000); mask-image:linear-gradient(135deg,transparent 40%,#000)}
.top-result{display:flex; flex-direction:column; gap:16px; padding:20px; border-radius:8px; background:var(--elev); position:relative; text-align:left; width:100%}
.top-result:hover{background:var(--elev2)}
.top-result .cover{width:96px; height:96px; border-radius:6px}
.top-result .tr-t{font-family:var(--display); font-size:34px; text-transform:uppercase; line-height:1}
.top-result .playfab{opacity:1; transform:none; right:18px; bottom:18px}
.search-grid{display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr); gap:24px}
.set-group{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:6px 18px; margin-bottom:16px; max-width:720px}
.set-row{display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .lbl{flex:1} .set-row .lbl b{display:block; font-weight:700} .set-row .lbl span{font-size:13px; color:var(--mute); line-height:1.45; display:block; margin-top:3px}
.swatches{display:flex; gap:10px}
.sw{width:34px; height:34px; border-radius:50%; border:2px solid transparent; box-shadow:inset 0 0 0 3px var(--panel2)}
.sw.on{border-color:var(--text)}
.seg{display:inline-flex; background:var(--elev); border-radius:999px; padding:3px}
.seg button{padding:7px 12px; border-radius:999px; font-size:13px; font-weight:600; color:var(--mute)}
.seg button.on{background:var(--elev2); color:var(--text)}
.meter{height:6px; border-radius:6px; background:var(--elev2); overflow:hidden; margin-top:8px}
.meter i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--gold))}

/* ---------- Desktop player bar ---------- */
.bar{grid-column:1/-1; height:84px; display:grid; grid-template-columns:minmax(180px,30%) minmax(0,40%) minmax(180px,30%); align-items:center; padding:0 8px calc(var(--sab)); gap:8px}
.bar-l{display:flex; align-items:center; gap:12px; min-width:0}
.bar-l .cover{width:56px; height:56px; border-radius:5px; cursor:pointer}
.bar-t{font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer}
.bar-t:hover{text-decoration:underline}
.bar-a{font-size:12.5px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:3px}
.bar-a:hover{color:var(--text); text-decoration:underline; cursor:pointer}
.bar-c{display:flex; flex-direction:column; align-items:center; gap:4px}
.ctrls{display:flex; align-items:center; gap:14px}
.ctrls .icon-btn{width:32px; height:32px}
.ctrls .icon-btn svg{width:19px; height:19px}
.playbtn{width:36px; height:36px; border-radius:50%; background:var(--text); color:#0a0607; display:grid; place-items:center}
.playbtn:hover{transform:scale(1.06)}
.playbtn svg{width:18px; height:18px}
.seekrow{display:flex; align-items:center; gap:8px; width:100%; max-width:640px; font-size:11.5px; color:var(--mute); font-variant-numeric:tabular-nums}
.seekrow span{width:40px; text-align:center}
.bar-r{display:flex; align-items:center; justify-content:flex-end; gap:6px}
.bar-r .icon-btn{width:32px; height:32px} .bar-r .icon-btn svg{width:18px; height:18px}
.vol{width:110px}
.dot-on{position:relative} .dot-on::after{content:""; position:absolute; bottom:1px; left:50%; width:4px; height:4px; margin-left:-2px; border-radius:50%; background:var(--accent)}
.skip-lbl{position:relative}
.skip-lbl small{position:absolute; inset:0; display:grid; place-items:center; font-size:7.5px; font-weight:800; padding-top:2px}

/* range sliders */
input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:16px; background:transparent; margin:0; cursor:pointer; --p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px; border-radius:4px; background:linear-gradient(90deg, var(--text) var(--p), rgba(255,255,255,.22) var(--p))}
input[type=range]::-moz-range-track{height:4px; border-radius:4px; background:rgba(255,255,255,.22)}
input[type=range]::-moz-range-progress{height:4px; border-radius:4px; background:var(--text)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:#fff; margin-top:-4px; opacity:0; transition:opacity .15s}
input[type=range]::-moz-range-thumb{width:12px; height:12px; border:0; border-radius:50%; background:#fff; opacity:0}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:active::-webkit-slider-thumb{opacity:1}
input[type=range]:hover::-moz-range-thumb{opacity:1}
input[type=range]:hover::-webkit-slider-runnable-track{background:linear-gradient(90deg, var(--accent) var(--p), rgba(255,255,255,.22) var(--p))}

/* ---------- Mobile mini player & nav ---------- */
.mini,.tabs,.m-only{display:none}

/* ---------- Now playing (player card) ---------- */
.np{position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; visibility:hidden; opacity:0; transition:opacity .28s, visibility .28s; overflow:hidden}
.np.open{visibility:visible; opacity:1}
.np-bg{position:absolute; inset:-60px; background:#000 center/cover no-repeat; filter:blur(50px) saturate(1.3) brightness(.5); transform:scale(1.15)}
.np-shade{position:absolute; inset:0; background:radial-gradient(ellipse at 50% 30%, rgba(122,10,23,.35), transparent 60%), linear-gradient(180deg, rgba(6,4,5,.35), rgba(6,4,5,.85)); }
.np-shade::after{content:""; position:absolute; inset:0; background-image:var(--halftone); background-size:6px 6px; opacity:.25; -webkit-mask-image:linear-gradient(180deg,#000,transparent 70%); mask-image:linear-gradient(180deg,#000,transparent 70%)}
.np-card{position:relative; width:min(430px, calc(100vw - 32px)); max-height:calc(100dvh - 32px); display:flex; flex-direction:column; background:linear-gradient(180deg, #1a1215, #0c0809); border-radius:28px; padding:18px 22px 20px; border:1px solid rgba(255,255,255,.09); box-shadow:0 0 0 6px #050304, 0 0 0 7px rgba(255,255,255,.07), 0 40px 90px rgba(0,0,0,.75); transform:translateY(30px) scale(.97); transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.np.open .np-card{transform:none}
.np-top{display:flex; align-items:center; gap:8px; margin-bottom:14px}
.np-top .from{flex:1; text-align:center; min-width:0}
.np-top .from small{display:block; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--mute); font-weight:700}
.np-top .from b{display:block; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px}
.np-art{position:relative; width:100%; aspect-ratio:1; border-radius:10px; overflow:hidden; background:#000; box-shadow:0 18px 40px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06); flex:none}
.np-art .cover{position:absolute; inset:0; width:100%; height:100%}
.np-art video{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; display:none}
.np-art.has-video video{display:block}
.np-art.has-video .cover{display:none}
.np-art.has-video{aspect-ratio:16/10}
.np-label{display:flex; align-items:center; gap:8px; margin-top:18px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:700}
.np-label i{width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent)}
.np-meta{display:flex; align-items:flex-start; gap:10px; margin-top:6px}
.np-meta .tx{flex:1; min-width:0}
.np-title{font-size:22px; font-weight:800; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.np-artist{font-size:15px; color:var(--mute); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer}
.np-seek{margin-top:16px}
.np-times{display:flex; justify-content:space-between; font-size:12px; color:var(--mute); font-variant-numeric:tabular-nums; margin-top:4px}
.np-ctrls{display:flex; align-items:center; justify-content:space-between; margin-top:10px}
.np-ctrls .icon-btn{width:48px; height:48px; color:var(--text)}
.np-ctrls .icon-btn svg{width:28px; height:28px}
.np-ctrls .skip-lbl small{font-size:9px; padding-top:3px}
.np-play{width:72px; height:72px; border-radius:50%; background:var(--text); color:#0a0607; display:grid; place-items:center; box-shadow:0 10px 30px rgba(0,0,0,.5)}
.np-play svg{width:30px; height:30px}
.np-play:active{transform:scale(.95)}
.np-sub{display:flex; align-items:center; justify-content:space-between; margin-top:12px; padding-top:12px; border-top:1px solid var(--line)}
.np-sub .icon-btn{width:40px; height:40px}
.np-sub .icon-btn svg{width:21px; height:21px}
.np-seek input[type=range]::-webkit-slider-thumb{opacity:1}
.np-seek input[type=range]::-moz-range-thumb{opacity:1}
.np-seek input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(90deg, var(--accent) var(--p), rgba(255,255,255,.2) var(--p))}
.np-seek input[type=range]::-moz-range-progress{background:var(--accent)}
.sleep-on{color:var(--gold)!important}

/* ---------- Sheets / modals ---------- */
.scrim{position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; visibility:hidden; transition:.2s}
.scrim.open{opacity:1; visibility:visible}
.sheet{width:min(440px,100%); max-height:min(80dvh,720px); overflow:auto; background:var(--elev); border:1px solid var(--line2); border-radius:14px; padding:8px; box-shadow:0 30px 80px rgba(0,0,0,.6); transform:translateY(16px); transition:transform .22s}
.scrim.open .sheet{transform:none}
.sheet-head{display:flex; align-items:center; gap:12px; padding:10px 10px 12px; border-bottom:1px solid var(--line); margin-bottom:6px}
.sheet-head .cover{width:48px; height:48px; border-radius:5px}
.sheet-head .t{font-weight:700} .sheet-head .s{font-size:13px; color:var(--mute); margin-top:2px}
.mi{display:flex; align-items:center; gap:14px; width:100%; padding:12px; border-radius:8px; text-align:left; font-weight:600; font-size:14.5px}
.mi:hover{background:var(--elev2)}
.mi svg{color:var(--mute); width:20px; height:20px}
.mi.danger{color:#ff6b7a} .mi.danger svg{color:#ff6b7a}
.dlg{padding:14px 12px 8px}
.dlg h3{margin:0 0 14px; font-family:var(--display); font-weight:400; font-size:26px; text-transform:uppercase; letter-spacing:.02em}
.dlg p{color:var(--mute); line-height:1.5; margin:0 0 14px; font-size:14px}
.field{display:block; margin-bottom:12px}
.field span{display:block; font-size:12px; font-weight:700; color:var(--mute); margin-bottom:6px; letter-spacing:.04em}
.field input{width:100%; height:42px; border-radius:6px; background:var(--panel2); border:1px solid var(--line2); padding:0 12px; outline:0}
.field input:focus{border-color:var(--accent)}
.field-2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.dlg-btns{display:flex; justify-content:flex-end; gap:10px; margin-top:16px}

/* ---------- Import dialog ---------- */
.imp{width:min(760px,100%); max-height:min(88dvh,700px); display:flex; flex-direction:column; background:#262022; border:1px solid var(--line2); border-radius:16px; box-shadow:0 30px 90px rgba(0,0,0,.7); overflow:hidden; transform:translateY(16px); transition:transform .22s}
.scrim.open .imp{transform:none}
.imp-top{padding:18px 20px 0; border-bottom:1px solid var(--line)}
.imp-search{display:flex; align-items:center; gap:12px; height:40px}
.imp-search input{flex:1; background:none; border:0; outline:0; font-size:17px; min-width:0}
.imp-search input::placeholder{color:var(--dim)}
.beta{font-size:11.5px; border:1px solid var(--line2); border-radius:999px; padding:3px 9px; color:var(--mute)}
.imp-tabs{display:flex; gap:6px; padding:12px 0 14px}
.imp-tab{display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:8px; font-weight:600; color:var(--mute)}
.imp-tab svg{width:19px; height:19px}
.imp-tab.on{background:rgba(255,255,255,.1); color:var(--text)}
.imp-body{flex:1; overflow:auto; padding:20px}
.drop{min-height:min(48dvh,420px); border-radius:14px; background:rgba(255,255,255,.05); border:1.5px dashed rgba(255,255,255,.14); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:28px; gap:6px; transition:.15s; position:relative; overflow:hidden; isolation:isolate}
.drop::before{content:""; position:absolute; inset:0; background-image:var(--halftone); background-size:7px 7px; opacity:0; transition:.2s; z-index:-1; -webkit-mask-image:radial-gradient(circle at 50% 50%,#000,transparent 70%); mask-image:radial-gradient(circle at 50% 50%,#000,transparent 70%)}
.drop.over{border-color:var(--accent); background:rgba(224,22,43,.08)}
.drop.over::before{opacity:.5}
.drop-ico{width:62px; height:62px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.07); margin-bottom:12px; color:var(--accent)}
.drop-ico svg{width:28px; height:28px}
.drop h4{margin:0; font-size:18px; font-weight:700}
.drop p{margin:2px 0 16px; color:var(--mute); font-size:14.5px}
.drop .btns{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
.btn-soft{padding:10px 16px; border-radius:8px; background:rgba(255,255,255,.12); font-weight:600}
.btn-soft:hover{background:rgba(255,255,255,.18)}
.btn-soft.accent{background:var(--accent); color:var(--on-accent)}
.imp-prog{width:100%; max-width:420px; margin-top:18px; display:none}
.imp-prog.show{display:block}
.imp-prog .meter{height:8px}
.imp-prog .ptext{font-size:13px; color:var(--mute); margin-top:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.imp-foot{display:flex; align-items:center; gap:10px; padding:14px 20px; border-top:1px solid var(--line); color:var(--mute); font-size:13.5px}
.imp-foot .grow{flex:1}
.kbd{display:inline-grid; place-items:center; min-width:24px; height:24px; border:1px solid var(--line2); border-radius:5px; font-size:12px}
.recent-row{display:flex; align-items:center; gap:12px; padding:8px; border-radius:8px; cursor:pointer}
.recent-row:hover{background:rgba(255,255,255,.07)}
.recent-row .cover{width:44px; height:44px; border-radius:4px}
.recent-row .when{font-size:12.5px; color:var(--dim); white-space:nowrap}

/* toast */
.toast{position:fixed; left:50%; bottom:calc(100px + var(--sab)); z-index:80; transform:translate(-50%,20px); background:var(--text); color:#0a0607; padding:11px 18px; border-radius:8px; font-weight:600; font-size:14px; opacity:0; pointer-events:none; transition:.25s; max-width:calc(100vw - 32px); text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1; transform:translate(-50%,0)}
.dropcover{position:fixed; inset:0; z-index:70; display:none; place-items:center; background:rgba(6,4,5,.82); border:3px dashed var(--accent); font-family:var(--display); font-size:48px; text-transform:uppercase; letter-spacing:.03em}
.dropcover.show{display:grid}

/* ---------- Phone layout ---------- */
@media (max-width: 860px){
  body{font-size:15px}
  .app{grid-template-columns:1fr; grid-template-rows:1fr auto auto; gap:0; padding:0}
  .side,.bar{display:none}
  .main{border-radius:0; border:0; background:var(--bg)}
  .scroll{padding-top:var(--sat)}
  .topbar{padding:10px 16px}
  .topbar.solid{background:rgba(6,4,5,.94)}
  .d-only{display:none!important}
  .m-only{display:flex}
  .mobile-brand{display:flex; align-items:center; gap:9px}
  .mobile-brand .brand-word{font-size:22px}
  .content{padding:0 16px calc(30px)}
  .hero{margin:-58px -16px 0; padding:80px 16px 18px; flex-direction:column; align-items:center; text-align:center; gap:16px}
  .hero .cover{width:min(62vw,250px)}
  .hero.artist{align-items:flex-start; text-align:left; min-height:300px; justify-content:flex-end}
  .hero-sub{justify-content:center}
  .hero.artist .hero-sub{justify-content:flex-start}
  .hero h1{font-size:clamp(34px,11vw,64px)}
  .empty{margin:-58px -16px 0; padding:100px 20px 40px}
  .actions{padding:16px 0 10px; gap:12px}
  .actions .spacer{flex:1}
  .actions .bigplay{order:9}
  .quick{grid-template-columns:1fr 1fr}
  .qt{height:52px; font-size:12.5px} .qt .cover{width:52px; height:52px} .qt .playfab{display:none}
  .row-scroll{grid-auto-columns:42vw}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .playfab{display:none}
  .thead{display:none}
  .row,.tracks.noalbum .row{grid-template-columns:minmax(0,1fr) 40px; gap:8px; padding:0 8px; min-height:60px}
  .row-n,.row-album,.row-dur,.row .like{display:none}
  .row .icon-btn{opacity:1}
  .search-grid{grid-template-columns:1fr}
  .genres{grid-template-columns:1fr 1fr; gap:10px}
  .genre{font-size:20px}
  .h-sec h2{font-size:22px}
  .mini{display:flex; position:relative; align-items:center; gap:10px; margin:0 8px 6px; padding:7px 8px 7px 7px; border-radius:8px; background:var(--mini,#3a0a12); background:linear-gradient(90deg, color-mix(in srgb,var(--mini,#5a0b16) 85%, #000), color-mix(in srgb,var(--mini,#5a0b16) 55%, #000)); overflow:hidden; cursor:pointer}
  .mini.hide{display:none}
  .mini .cover{width:42px; height:42px; border-radius:5px}
  .mini .tx{flex:1; min-width:0}
  .mini .t{font-weight:700; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .mini .a{font-size:12.5px; color:rgba(255,255,255,.72); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px}
  .mini .icon-btn{color:var(--text); width:38px; height:38px}
  .mini .prog{position:absolute; left:8px; right:8px; bottom:2px; height:2px; background:rgba(255,255,255,.2); border-radius:2px; overflow:hidden}
  .mini .prog i{display:block; height:100%; width:0; background:#fff}
  .tabs{display:grid; grid-template-columns:repeat(4,1fr); padding:6px 4px calc(6px + var(--sab)); background:linear-gradient(180deg, rgba(6,4,5,.85), #060405 40%)}
  .tab{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; font-weight:600; color:var(--mute); padding:4px 0}
  .tab svg{width:24px; height:24px}
  .tab.on{color:var(--text)} .tab.on svg{color:var(--accent)}
  .toast{bottom:calc(140px + var(--sab))}
  .np{align-items:stretch}
  .np-card{width:100%; max-height:none; height:100%; border-radius:0; box-shadow:none; border:0; background:linear-gradient(180deg, rgba(20,12,15,.35), rgba(6,4,5,.92) 55%); padding:calc(10px + var(--sat)) 22px calc(18px + var(--sab)); justify-content:flex-start; overflow-y:auto}
  .np-art{width:min(100%, 52dvh); margin:4px auto 0}
  .np-body{margin-top:auto}
  .imp{max-height:92dvh}
  .imp-body{padding:14px}
  .drop{min-height:46dvh}
  .scrim.bottom{align-items:flex-end; padding:0}
  .scrim.bottom .sheet{width:100%; border-radius:16px 16px 0 0; padding-bottom:calc(10px + var(--sab)); max-height:85dvh}
}
@media (max-width: 860px) and (max-height: 640px){
  .np-art{width:min(100%,42dvh)}
  .np-title{font-size:19px}
  .np-play{width:62px; height:62px}
}
@media (min-width: 861px) and (max-height: 760px){
  .np-art{width:min(100%,44dvh); margin:0 auto}
}
@media (hover:none){
  .row .icon-btn{opacity:1}
}
</style>

<script>
'use strict';
/* =========================================================
   Grimoire — offline music library
   Everything is stored in this browser (IndexedDB). Nothing is uploaded.
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fmt=t=>{if(!isFinite(t)||t<0)t=0;t=Math.floor(t);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`};
const fmtLong=t=>{t=Math.round(t||0);const h=Math.floor(t/3600),m=Math.floor(t%3600/60);return h?`${h} hr ${m} min`:`${m} min ${t%60} sec`};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const ico=(n,f)=>`<svg class="i${f?' f':''}"><use href="#i-${n}"/></svg>`;
const ls={get(k,d){try{const v=localStorage.getItem('g_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('g_'+k,JSON.stringify(v))}catch(e){}}};
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

/* ---------------- Storage (IndexedDB with in-memory fallback) ---------------- */
const STORES=['tracks','blobs','covers','playlists'];
const DB={db:null,ok:false,mem:Object.fromEntries(STORES.map(s=>[s,new Map()])),
  async open(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('grimoire',1);r.onupgradeneeded=()=>{const d=r.result;for(const s of STORES)if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))});this.ok=true}catch(e){console.warn('IndexedDB unavailable, using memory',e);this.ok=false}},
  tx(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode),s=t.objectStore(store);let out;const r=fn(s);if(r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('aborted'))})},
  all(s){return this.ok?this.tx(s,'readonly',st=>st.getAll()):Promise.resolve([...this.mem[s].values()])},
  get(s,id){return this.ok?this.tx(s,'readonly',st=>st.get(id)):Promise.resolve(this.mem[s].get(id))},
  put(s,o){if(!this.ok){this.mem[s].set(o.id,o);return Promise.resolve()}return this.tx(s,'readwrite',st=>st.put(o))},
  del(s,id){if(!this.ok){this.mem[s].delete(id);return Promise.resolve()}return this.tx(s,'readwrite',st=>st.delete(id))},
  async putMany(s,arr){if(!arr.length)return;if(!this.ok){arr.forEach(o=>this.mem[s].set(o.id,o));return}return this.tx(s,'readwrite',st=>{arr.forEach(o=>st.put(o))})},
  async clear(){for(const s of STORES){if(!this.ok)this.mem[s].clear();else await this.tx(s,'readwrite',st=>st.clear())}}
};

/* ---------------- Tag readers: ID3 (MP3) and MP4/M4A atoms ---------------- */
const td=(enc)=>{try{return new TextDecoder(enc)}catch(e){return new TextDecoder('utf-8')}};
const DEC={latin1:td('iso-8859-1'),utf8:td('utf-8'),le:td('utf-16le'),be:td('utf-16be')};
const cleanStr=s=>s.replace(/\u0000+$/,'').replace(/\u0000/g,' / ').replace(/^﻿/,'').trim();
function decodeText(enc,b){
  if(!b.length)return'';
  if(enc===0)return cleanStr(DEC.latin1.decode(b));
  if(enc===3)return cleanStr(DEC.utf8.decode(b));
  if(enc===1){if(b[0]===0xFE&&b[1]===0xFF)return cleanStr(DEC.be.decode(b.subarray(2)));if(b[0]===0xFF&&b[1]===0xFE)return cleanStr(DEC.le.decode(b.subarray(2)));return cleanStr(DEC.le.decode(b))}
  return cleanStr(DEC.be.decode(b));
}
function termEnd(b,start,enc){if(enc===1||enc===2){for(let i=start;i+1<b.length;i+=2)if(b[i]===0&&b[i+1]===0)return i;return b.length}for(let i=start;i<b.length;i++)if(b[i]===0)return i;return b.length}
const ss=(b,o)=>(b[o]&0x7f)<<21|(b[o+1]&0x7f)<<14|(b[o+2]&0x7f)<<7|(b[o+3]&0x7f);
const u32=(b,o)=>((b[o]<<24)>>>0)+(b[o+1]<<16)+(b[o+2]<<8)+b[o+3];
const ascii=(b,o,n)=>{let s='';for(let i=0;i<n;i++)s+=String.fromCharCode(b[o+i]);return s};
function unsync(b){const out=new Uint8Array(b.length);let j=0;for(let i=0;i<b.length;i++){out[j++]=b[i];if(b[i]===0xFF&&b[i+1]===0x00)i++}return out.subarray(0,j)}
function sniffImg(b){if(b[0]===0xFF&&b[1]===0xD8)return'image/jpeg';if(b[0]===0x89&&b[1]===0x50)return'image/png';if(b[0]===0x47&&b[1]===0x49)return'image/gif';if(ascii(b,8,4)==='WEBP')return'image/webp';return'image/jpeg'}
async function parseID3(file){
  const h=new Uint8Array(await file.slice(0,10).arrayBuffer());
  const ver=h[3],flags=h[5],size=ss(h,6);
  let data=new Uint8Array(await file.slice(10,10+size).arrayBuffer());
  if((flags&0x80)&&ver<4)data=unsync(data);
  let p=0;const out={};let pics=[];
  if(flags&0x40){p=ver===4?ss(data,0):u32(data,0)+4}
  while(p<data.length){
    let id,sz,ff=0;
    if(ver===2){if(p+6>data.length)break;id=ascii(data,p,3);sz=(data[p+3]<<16)|(data[p+4]<<8)|data[p+5];p+=6}
    else{if(p+10>data.length)break;id=ascii(data,p,4);sz=ver===4?ss(data,p+4):u32(data,p+4);ff=data[p+9];p+=10}
    if(!/^[A-Z0-9]{3,4}$/.test(id)||sz<=0||p+sz>data.length+4)break;
    let fr=data.subarray(p,Math.min(p+sz,data.length));p+=sz;
    if(ver===4){if(ff&0x0C)continue;if(ff&0x02)fr=unsync(fr);if(ff&0x01)fr=fr.subarray(4)}
    else if(ver===3&&(ff&0xC0))continue;
    const k=id;
    if(k[0]==='T'&&k!=='TXXX'&&k!=='TXX'){
      const v=decodeText(fr[0],fr.subarray(1));
      const map={TIT2:'title',TT2:'title',TPE1:'artist',TP1:'artist',TPE2:'albumArtist',TP2:'albumArtist',TALB:'album',TAL:'album',TRCK:'track',TRK:'track',TPOS:'disc',TPA:'disc',TYER:'year',TYE:'year',TDRC:'year',TCON:'genre',TCO:'genre'};
      if(map[k]&&v&&!out[map[k]])out[map[k]]=v;
    }else if(k==='APIC'||k==='PIC'){
      const enc=fr[0];let i,mime,type;
      if(k==='PIC'){const f=ascii(fr,1,3).toLowerCase();mime=f==='png'?'image/png':'image/jpeg';type=fr[4];i=5}
      else{const e=termEnd(fr,1,0);mime=DEC.latin1.decode(fr.subarray(1,e)).toLowerCase();type=fr[e+1];i=e+2}
      const de=termEnd(fr,i,enc);i=de+((enc===1||enc===2)?2:1);
      const img=fr.slice(i);
      if(img.length>100){if(!mime||!mime.includes('/')||mime==='image/jpg')mime=sniffImg(img);pics.push({type,blob:new Blob([img],{type:mime})})}
    }
  }
  if(pics.length){out.picture=(pics.find(x=>x.type===3)||pics[0]).blob}
  return out;
}
async function parseID3v1(file){
  if(file.size<128)return{};
  const b=new Uint8Array(await file.slice(file.size-128).arrayBuffer());
  if(ascii(b,0,3)!=='TAG')return{};
  const s=(o,n)=>cleanStr(DEC.latin1.decode(b.subarray(o,o+n)));
  const o={title:s(3,30),artist:s(33,30),album:s(63,30),year:s(93,4)};
  if(b[125]===0&&b[126])o.track=String(b[126]);

  const vids=allTracks().filter(t=>t.kind==='video');

  const top=allTracks().filter(t=>t.plays>0).sort((a,b)=>b.plays-a.plays||b.lastPlayed-a.lastPlayed).slice(0,5);
  if(top.length){const k=regList(top.map(t=>t.id),'On repeat');html+=sec('On repeat',trackTable(top.map(t=>t.id),'list',k))}
  const arts=ar.slice().sort((a,b)=>b.plays-a.plays||b.added-a.added).slice(0,14);
  html+=sec('Your artists',`<div class="row-scroll">${arts.map(a=>collCard({v:'artist',k:a.name})).join('')}</div>`);
  if(al.length>4)html+=sec('All albums',`<div class="grid">${al.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(a=>collCard({v:'album',k:a.key})).join('')}</div>`);
  return html;
}
function libItems(filter,sort){
  let items=[];
  const pl=[...S.playlists.values()];
  if(filter==='playlists'){items=[{v:'liked',k:'',t:'Liked Songs',s:`Playlist · ${plural(liked().length,'song')}`,last:Math.max(0,...liked().map(x=>x.lastPlayed||0)),added:Infinity},...pl.map(p=>{const c=getColl('playlist',p.id);return{v:'playlist',k:p.id,t:p.name,s:`Playlist · ${plural(c.ids.length,'song')}`,cov:c.coverId,last:p.last||0,added:p.created}})];if(getColl('videos').ids.length)items.push({v:'videos',k:'',t:'Music Videos',s:plural(getColl('videos').ids.length,'video'),last:0,added:0})}
  else if(filter==='albums')items=albums().map(a=>({v:'album',k:a.key,t:a.name,s:`Album · ${a.artist}`,cov:a.coverId,last:a.last,added:a.added}));
  else if(filter==='artists')items=artists().map(a=>({v:'artist',k:a.name,t:a.name,s:`Artist · ${plural(a.albums.size,'album')}`,cov:a.coverId,round:true,last:a.last,added:a.added}));
  else if(filter==='songs')items=allTracks().map(t=>({v:'song',k:t.id,t:t.title,s:`${t.kind==='video'?'Video':'Song'} · ${t.artist}`,cov:t.coverId,seed:t.album||t.title,last:t.lastPlayed||0,added:t.addedAt}));
  if(sort==='az')items.sort((a,b)=>a.v==='liked'?-1:b.v==='liked'?1:a.t.localeCompare(b.t));
  else if(sort==='added')items.sort((a,b)=>b.added-a.added);
  else items.sort((a,b)=>(b.last||0)-(a.last||0)||b.added-a.added);
  return items;
}
function libRow(it,songsKey,i){

  const active=(S.view.name===it.v&&(S.view.k||'')===it.k);

}

function vSearch(){
  return`<div style="display:flex;gap:10px;align-items:center;margin:4px 0 6px"><label class="search-box">${ico('search')}<input id="q" type="search" placeholder="What do you want to play?" value="${esc(S.q)}" autocomplete="off" enterkeyhint="search"></label></div><div id="results">${searchResults()}</div>`;
}
function searchResults(){
  const q=norm(S.q).trim();
  if(!q){
    const gs=new Map();for(const t of allTracks()){if(t.genre){gs.set(t.genre,(gs.get(t.genre)||0)+1)}}
    const tiles=[...gs.entries()].sort((a,b)=>b[1]-a[1]).slice(0,12);
    const base=[['Liked Songs','liked'],['Music Videos','videos'],['All Songs','songs']].filter(([,v])=>getColl(v).ids.length||v==='songs');
    if(!S.tracks.size)return`<div class="muted" style="padding:30px 0">Add some music first, then search it here.</div>`;
    return sec('Browse',`<div class="genres">${base.map(([t,v])=>`<button class="genre" data-act="open" data-v="${v}" data-k="" style="${phStyle(t)}">${esc(t)}</button>`).join('')}${tiles.map(([g])=>`<button class="genre" data-act="genre" data-g="${esc(g)}" style="${phStyle(g)}">${esc(g)}</button>`).join('')}</div>`);
  }
  const words=q.split(/\s+/);const m=s=>{const n=norm(s);return words.every(w=>n.includes(w))};
  const songs=allTracks().filter(t=>m(t.title+' '+t.artist+' '+t.album+' '+t.genre)).sort((a,b)=>(norm(b.title).startsWith(q)-norm(a.title).startsWith(q))||b.plays-a.plays).slice(0,50);
  const al=albums().filter(a=>m(a.name+' '+a.artist)).slice(0,12);
  const ar=artists().filter(a=>m(a.name)).slice(0,12);
  const pl=[...S.playlists.values()].filter(p=>m(p.name));
  if(!songs.length&&!al.length&&!ar.length&&!pl.length)return`<div style="padding:50px 0;text-align:center"><div class="greet" style="font-size:30px">No results for “${esc(S.q)}”</div><div class="muted">Check the spelling, or try fewer words.</div></div>`;
  let topHTML='';
  const topA=ar.find(a=>norm(a.name)===q)||ar[0];const topAl=al[0];
  if(topA&&(!topAl||norm(topA.name).startsWith(q)))topHTML=`<div class="top-result" data-act="open" data-v="artist" data-k="${esc(topA.name)}" role="button">${coverHTML(topA.coverId,topA.name,'')}<div><div class="tr-t">${esc(topA.name)}</div><div class="muted" style="margin-top:6px">Artist</div></div><button class="playfab" data-act="play-coll" data-v="artist" data-k="${esc(topA.name)}">${ico('play',true)}</button></div>`;
  else if(topAl)topHTML=`<div class="top-result" data-act="open" data-v="album" data-k="${esc(topAl.key)}" role="button">${coverHTML(topAl.coverId,topAl.name)}<div><div class="tr-t">${esc(topAl.name)}</div><div class="muted" style="margin-top:6px">Album · ${esc(topAl.artist)}</div></div><button class="playfab" data-act="play-coll" data-v="album" data-k="${esc(topAl.key)}">${ico('play',true)}</button></div>`;
  else if(songs[0]){const t=songs[0];const k=regList([t.id],t.title);topHTML=`<div class="top-result" data-act="row" data-v="list" data-k="${k}" data-i="0" role="button">${coverHTML(t.coverId,t.album||t.title)}<div><div class="tr-t">${esc(t.title)}</div><div class="muted" style="margin-top:6px">Song · ${esc(t.artist)}</div></div><span class="playfab">${ico('play',true)}</span></div>`}
  const sk=regList(songs.map(t=>t.id),`Search: ${S.q}`);
  let html=`<div class="search-grid"><div>${sec('Top result',topHTML)}</div><div>${songs.length?sec('Songs',trackTable(songs.slice(0,5).map(t=>t.id),'list',sk,{noAlbum:true})):''}</div></div>`;
  if(ar.length)html+=sec('Artists',`<div class="row-scroll">${ar.map(a=>collCard({v:'artist',k:a.name})).join('')}</div>`);
  if(al.length)html+=sec('Albums',`<div class="row-scroll">${al.map(a=>collCard({v:'album',k:a.key})).join('')}</div>`);
  if(pl.length)html+=sec('Playlists',`<div class="row-scroll">${pl.map(p=>collCard({v:'playlist',k:p.id})).join('')}</div>`);
  if(songs.length>5)html+=sec('All matching songs',trackTable(songs.map(t=>t.id),'list',sk));
  return html;
}
function vColl(v,k){
  const c=getColl(v,k);
  if(!c)return`<div style="padding:60px 0"><div class="greet">Not found</div><p class="muted">This was removed from your library.</p><button class="pill" data-act="tab" data-tab="home">Go home</button></div>`;
  const ts=c.ids.map(id=>S.tracks.get(id));const total=ts.reduce((s,t)=>s+(t.duration||0),0);
  const cov=c.liked?likedCover():v==='videos'?videosCover():coverHTML(c.coverId,c.seed);
  let sub='';
  if(v==='album'){const a=albumMap().get(k);sub=`<b class="link" data-act="open" data-v="artist" data-k="${esc(a.artist)}" style="cursor:pointer">${esc(a.artist)}</b>${a.year?`<span class="dot">•</span>${esc(a.year)}`:''}<span class="dot">•</span>${plural(ts.length,'song')}, <span class="muted" style="color:inherit;opacity:.75">${fmtLong(total)}</span>`}
  else if(v==='artist'){const a=artistMap().get(k);sub=`${plural(a.albums.size,'album')}<span class="dot">•</span>${plural(ts.length,'song')}<span class="dot">•</span>${a.plays?plural(a.plays,'play'):'Not played yet'}`}
  else sub=`${plural(ts.length,'song')}${total?`, <span style="opacity:.75">${fmtLong(total)}</span>`:''}`;
  const isPlayingThis=P.fromRef&&P.fromRef.v===v&&(P.fromRef.k||'')===(k||'')&&!P.el.paused;
  let html=`<section class="hero ${c.round?'round artist':''}" data-hc="${esc(c.coverId||'')}" data-seed="${esc(c.seed||'')}">${v==='artist'?'':cov}<div class="hero-meta"><div class="hero-type">${esc(c.type)}</div><h1>${esc(c.title)}</h1><div class="hero-sub">${sub}</div></div></section>
  <div class="actions" data-hc2>
    <button class="bigplay" data-act="${isPlayingThis?'toggle':'play-coll'}" data-v="${v}" data-k="${esc(k)}" title="Play">${ico(isPlayingThis?'pause':'play',true)}</button>
    <button class="icon-btn big ${P.shuffle?'on':''}" data-act="shuffle-coll" data-v="${v}" data-k="${esc(k)}" title="Shuffle play">${ico('shuffle')}</button>
    <button class="icon-btn big" data-act="coll-menu" data-v="${v}" data-k="${esc(k)}" title="More">${ico('dots')}</button>
    <div class="spacer"></div>
  </div>`;
  if(v==='artist'){
    const a=artistMap().get(k);
    const pop=ts.slice().sort((x,y)=>(y.plays||0)-(x.plays||0)||y.lastPlayed-x.lastPlayed).slice(0,5);
    const pk=regList(pop.map(t=>t.id),c.title);
    html+=sec('Popular',trackTable(pop.map(t=>t.id),'list',pk));
    const als=[...a.albums].map(key=>albumMap().get(key)).filter(Boolean).sort((x,y)=>(y.year||'').localeCompare(x.year||''));
    html+=sec('Discography',`<div class="grid">${als.map(al=>collCard({v:'album',k:al.key})).join('')}</div>`);
    if(ts.length>5)html+=sec('All songs',trackTable(c.ids,v,k));
  }else{
    html+=trackTable(c.ids,v,k,{num:v==='album',cover:v!=='album',noAlbum:v==='album',empty:c.liked?'Songs you like will show up here. Tap the ♥ on any song.':v==='playlist'?'Add songs from any song’s ⋯ menu.':undefined});
  }
  return html;
}

function dialog({title,body='',fields=[],ok='Save',danger=false,onOk}){
  const f=fields.map(x=>x.row?`<div class="field-2">${x.row.map(fieldHTML).join('')}</div>`:fieldHTML(x)).join('');
  openSheet(`<form class="dlg" id="dlg">${title?`<h3>${esc(title)}</h3>`:''}${body?`<p>${body}</p>`:''}${f}<div class="dlg-btns"><button type="button" class="pill ghost" data-act="sheet-close">Cancel</button><button type="submit" class="pill ${danger?'':'accent'}" ${danger?'style="background:#ff4d5e;color:#fff"':''}>${esc(ok)}</button></div></form>`,{bottom:false});
  $('#dlg').addEventListener('submit',e=>{e.preventDefault();const vals=Object.fromEntries(new FormData(e.target).entries());closeSheet();onOk&&onOk(vals)});
}
function fieldHTML(x){return`<label class="field"><span>${esc(x.label)}</span><input name="${x.name}" value="${esc(x.value||'')}" ${x.ph?`placeholder="${esc(x.ph)}"`:''} ${x.type?`inputmode="${x.type}"`:''} autocomplete="off"></label>`}
function playlistPicker(ids){
  const pls=[...S.playlists.values()].sort((a,b)=>(b.last||b.created)-(a.last||a.created));
  swapSheet(`<div class="sheet-head"><div class="t" style="font-family:var(--display);font-size:22px;font-weight:400;text-transform:uppercase">Add to playlist</div></div>${menuItem('pl-new','plus','New playlist',`data-ids="${ids.join(',')}"`)}${pls.map(p=>`<button class="li" data-act="pl-add" data-p="${p.id}" data-ids="${ids.join(',')}">${coverHTML(getColl('playlist',p.id).coverId,p.name)}<div class="li-b"><div class="li-t">${esc(p.name)}</div><div class="li-s">${plural(p.ids.length,'song')}</div></div></button>`).join('')}`);
}
async function newPlaylist(ids=[]){
  dialog({title:'New playlist',fields:[{name:'name',label:'Name',value:`My Playlist #${S.playlists.size+1}`}],ok:'Create',onOk:async({name})=>{const p={id:'p'+uid(),name:(name||'').trim()||'Untitled',ids,created:Date.now(),last:Date.now()};await DB.put('playlists',p);S.playlists.set(p.id,p);changed();toast(ids.length?`Added to ${p.name}`:`Created ${p.name}`);if(!ids.length)go({name:'playlist',k:p.id});else render(false)}});
}
async function addToPlaylist(pid,ids){const p=S.playlists.get(pid);if(!p)return;const add=ids.filter(id=>!p.ids.includes(id));p.ids.push(...add);p.last=Date.now();await DB.put('playlists',p);changed();closeSheet();toast(add.length?`Added to ${p.name}`:`Already in ${p.name}`);render(false)}
function pickCover(cb){const inp=$('#cover-in');inp.onchange=async()=>{const f=inp.files[0];inp.value='';if(!f)return;const b=await shrinkImage(f);const id=await addCoverBlob(b);cb(id)};inp.click()}
async function deleteTracks(ids){
  for(const id of ids){await DB.del('tracks',id);await DB.del('blobs',id);S.tracks.delete(id)}
  for(const p of S.playlists.values()){const n=p.ids.length;p.ids=p.ids.filter(id=>S.tracks.has(id));if(p.ids.length!==n)await DB.put('playlists',p)}
  const used=new Set([...allTracksRaw()].map(t=>t.coverId));for(const p of S.playlists.values())used.add(p.coverId);
  for(const [cid,url] of S.coverURL){if(!used.has(cid)){await DB.del('covers',cid);URL.revokeObjectURL(url);S.coverURL.delete(cid)}}
  const curId=P.order[P.idx];const wasCur=ids.includes(curId);
  P.order=P.order.filter(id=>S.tracks.has(id));P.base=P.base.filter(id=>S.tracks.has(id));
  if(wasCur){P.el.pause();P.el.removeAttribute('src');P.idx=Math.min(P.idx,P.order.length-1);if(P.order.length)loadCur(false);else{P.idx=-1;updateNP()}}else P.idx=Math.max(0,P.order.indexOf(curId));
  changed();saveSession();render(false);updateNP();
}
const allTracksRaw=()=>S.tracks.values();
async function editTrack(t,vals){
  t.title=vals.title.trim()||t.title;t.artist=vals.artist.trim()||'Unknown Artist';t.album=vals.album.trim()||t.title;t.albumArtist=vals.albumArtist.trim()||t.artist;t.track=vals.track.trim();t.year=vals.year.trim();t.genre=vals.genre.trim();
  const nk=norm(t.albumArtist)+'\u0001'+norm(t.album);
  if(nk!==t.albumKey){t.albumKey=nk;if(!t.coverId){const sib=allTracks().find(x=>x.albumKey===nk&&x.coverId);if(sib)t.coverId=sib.coverId}}
  await DB.put('tracks',t);changed();
}

/* ---------------- Actions (event delegation) ---------------- */
let deferredInstall=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('#btn-install').hidden=false});
addEventListener('appinstalled',()=>{deferredInstall=null;$('#btn-install').hidden=true;toast('Installed — find Grimoire on your home screen')});
const A={
  tab:el=>tab(el.dataset.tab),
  back:()=>{if(navDepth>0){S.fwd.push(S.view);history.back()}else tab('home')},
  fwd:()=>{const v=S.fwd.pop();if(v){S.view=v;navDepth++;try{history.pushState({view:v},'')}catch(e){}render()}},
  import:(el,e)=>{e&&e.preventDefault();closeAll(()=>openImport())},
  'imp-close':()=>popOv(),
  'imp-scrim':(el,e)=>{if(e.target===el)popOv()},
  'imp-tab':el=>setImpTab(el.dataset.t),
  pick:()=>$('#file-in').click(),
  'pick-folder':()=>$('#folder-in').click(),
  scrim:(el,e)=>{if(e.target===el)popOv()},
  'sheet-close':()=>closeSheet(),
  open:el=>{const v=el.dataset.v,k=el.dataset.k||'';closeAll(()=>go({name:v,k}))},
  'play-coll':el=>{const v=el.dataset.v,k=el.dataset.k||'';if(P.fromRef&&P.fromRef.v===v&&(P.fromRef.k||'')===k&&P.el.getAttribute('src')){toggle();return}playColl(v,k,0,P.shuffle?{randomStart:true}:{});setTimeout(()=>render(false),50)},
  'shuffle-coll':el=>{playColl(el.dataset.v,el.dataset.k||'',0,{shuffle:true,randomStart:true});setTimeout(()=>render(false),50)},
  row:el=>{const v=el.dataset.v,k=el.dataset.k||'',i=+el.dataset.i;const c=getColl(v,k);if(!c)return;const id=c.ids[i];if(P.order[P.idx]===id&&P.el.getAttribute('src')){toggle();return}if(P.shuffle){const ids=c.ids;P.base=ids.slice();P.from=c.label;P.fromRef={v,k};P.order=[id,...shuffleArr(ids.filter(x=>x!==id))];P.idx=0;loadCur(true)}else playIds(c.ids,i,c.label,{},{v,k});if(['album','artist','playlist','liked','videos'].includes(v))pushRecent(v,k)},
  toggle:()=>toggle(),next:()=>next(),prev:()=>prev(),back10:()=>seekBy(-10),fwd10:()=>seekBy(10),
  shuffle:()=>setShuffle(!P.shuffle),repeat:()=>cycleRepeat(),mute:()=>toggleMute(),
  'np-open':(el,e)=>{if(e.target.closest('[data-act]')!==el)return;openNP()},
  'np-close':()=>popOv(),
  queue:()=>openQueue(),
  sleep:()=>openSheet(`<div class="sheet-head"><div class="t" style="font-family:var(--display);font-size:22px;font-weight:400;text-transform:uppercase">Sleep timer</div></div>${[5,15,30,45,60].map(m=>menuItem('sleep-set','moon',`${m} minutes`,`data-m="${m}"`)).join('')}${menuItem('sleep-set','disc','End of this song','data-m="end"')}${(P.sleepAt||P.sleepEnd)?menuItem('sleep-set','x','Turn off timer','data-m="0"','danger'):''}`),
  'sleep-set':el=>{const m=el.dataset.m;setSleep(m==='end'?'end':+m);closeSheet()},
  like:async el=>{const t=S.tracks.get(el.dataset.id);if(!t)return;await setLike(t,!t.fav);el.classList.toggle('on',t.fav);el.innerHTML=ico('heart',t.fav)},
  'like-cur':async()=>{const t=P.cur();if(t)await setLike(t,!t.fav)},
  'go-artist-cur':()=>{const t=P.cur();if(t)closeAll(()=>go({name:'artist',k:t.albumArtist||t.artist}))},
  'menu-cur':()=>{const t=P.cur();if(t)trackMenu(t.id,P.fromRef&&P.fromRef.v,P.fromRef&&P.fromRef.k)},
  menu:el=>trackMenu(el.dataset.id,el.dataset.v,el.dataset.k),
  'coll-menu':el=>collMenu(el.dataset.v,el.dataset.k||''),
  'lib-filter':el=>{S.libFilter=el.dataset.f;ls.set('libFilter',S.libFilter);if(S.view.name==='library')render(false);else renderSide()},
  sort:()=>{const keys=Object.keys(SORTS);S.libSort=keys[(keys.indexOf(S.libSort)+1)%keys.length];ls.set('libSort',S.libSort);if(S.view.name==='library')render(false);else renderSide();toast('Sorted by '+SORTS[S.libSort].toLowerCase())},
  genre:el=>go({name:'genre',k:el.dataset.g}),
  'new-playlist':()=>newPlaylist([]),
  'm-like':async el=>{const t=S.tracks.get(el.dataset.id);closeSheet();await setLike(t,!t.fav)},
  'm-next':el=>{closeSheet();playNext(el.dataset.id)},
  'm-queue':el=>{closeSheet();addQueue(el.dataset.id)},
  'm-addpl':el=>playlistPicker([el.dataset.id]),
  'pl-new':el=>{const ids=el.dataset.ids.split(',').filter(Boolean);closeSheet();setTimeout(()=>newPlaylist(ids),80)},
  'pl-add':el=>addToPlaylist(el.dataset.p,el.dataset.ids.split(',').filter(Boolean)),
  'm-rmpl':async el=>{const p=S.playlists.get(el.dataset.k);if(!p)return;p.ids=p.ids.filter(x=>x!==el.dataset.id);await DB.put('playlists',p);changed();closeSheet();render(false);toast('Removed from playlist')},
  'm-album':el=>{const t=S.tracks.get(el.dataset.id);closeAll(()=>go({name:'album',k:t.albumKey}))},
  'm-artist':el=>{const t=S.tracks.get(el.dataset.id);closeAll(()=>go({name:'artist',k:t.albumArtist||t.artist}))},
  'm-edit':el=>{const t=S.tracks.get(el.dataset.id);closeSheet();setTimeout(()=>dialog({title:'Edit song info',fields:[{name:'title',label:'Title',value:t.title},{name:'artist',label:'Artist',value:t.artist},{row:[{name:'album',label:'Album',value:t.album},{name:'albumArtist',label:'Album artist',value:t.albumArtist}]},{row:[{name:'track',label:'Track #',value:t.track,type:'numeric'},{name:'year',label:'Year',value:t.year,type:'numeric'}]},{name:'genre',label:'Genre',value:t.genre}],onOk:async vals=>{await editTrack(t,vals);render(false);updateNP();toast('Saved')}}),80)},
  'm-cover':el=>{const t=S.tracks.get(el.dataset.id);closeSheet();pickCover(async cid=>{t.coverId=cid;t.coverFromTag=false;await DB.put('tracks',t);changed();render(false);updateNP();toast('Cover updated')})},
  'm-del':el=>{const t=S.tracks.get(el.dataset.id);closeSheet();setTimeout(()=>dialog({title:'Delete song?',body:`“${esc(t.title)}” will be removed from this device.`,ok:'Delete',danger:true,onOk:()=>deleteTracks([t.id]).then(()=>toast('Deleted'))}),80)},
  'c-next':el=>{const c=getColl(el.dataset.v,el.dataset.k||'');closeSheet();playNext(c.ids)},
  'c-queue':el=>{const c=getColl(el.dataset.v,el.dataset.k||'');closeSheet();addQueue(c.ids)},
  'c-addpl':el=>{const c=getColl(el.dataset.v,el.dataset.k||'');playlistPicker(c.ids)},
  'c-cover':el=>{const v=el.dataset.v,k=el.dataset.k;closeSheet();pickCover(async cid=>{if(v==='album'){const a=albumMap().get(k);for(const t of a.tracks){t.coverId=cid;t.coverFromTag=false}await DB.putMany('tracks',a.tracks)}else if(v==='playlist'){const p=S.playlists.get(k);p.coverId=cid;await DB.put('playlists',p)}colorCache.delete(cid);changed();render(false);updateNP();toast('Cover updated')})},
  'c-edit':el=>{const a=albumMap().get(el.dataset.k);closeSheet();setTimeout(()=>dialog({title:'Edit album',fields:[{name:'album',label:'Album name',value:a.name},{name:'albumArtist',label:'Album artist',value:a.artist},{name:'year',label:'Year',value:a.year,type:'numeric'}],onOk:async vals=>{const nk=norm(vals.albumArtist.trim()||a.artist)+'\u0001'+norm(vals.album.trim()||a.name);for(const t of a.tracks){t.album=vals.album.trim()||a.name;t.albumArtist=vals.albumArtist.trim()||a.artist;t.year=vals.year.trim();t.albumKey=nk}await DB.putMany('tracks',a.tracks);changed();S.view={name:'album',k:nk};try{history.replaceState({view:S.view},'')}catch(e){}render(false);updateNP();toast('Saved')}}),80)},
  'c-rename':el=>{const p=S.playlists.get(el.dataset.k);closeSheet();setTimeout(()=>dialog({title:'Rename playlist',fields:[{name:'name',label:'Name',value:p.name}],onOk:async({name})=>{p.name=name.trim()||p.name;await DB.put('playlists',p);changed();render(false)}}),80)},
  'c-del':el=>{const v=el.dataset.v,k=el.dataset.k;const c=getColl(v,k);closeSheet();setTimeout(()=>dialog({title:v==='playlist'?'Delete playlist?':'Delete songs?',body:v==='playlist'?`“${esc(c.title)}” will be deleted. The songs stay in your library.`:`${plural(c.ids.length,'song')} will be removed from this device.`,ok:'Delete',danger:true,onOk:async()=>{if(v==='playlist'){await DB.del('playlists',k);S.playlists.delete(k);changed()}else await deleteTracks(c.ids);tab('home');toast('Deleted')}}),80)},
  accent:el=>{S.accent=el.dataset.a;ls.set('accent',S.accent);document.documentElement.dataset.accent=S.accent;render(false)},
  'video-mode':el=>{S.videoMode=el.dataset.m;ls.set('videoMode',S.videoMode);render(false);const t=P.cur();if(t&&t.kind==='video'&&P.el.getAttribute('src')){const time=P.el.currentTime,playing=!P.el.paused;loadCur(playing,time)}},
  install:async()=>{if(deferredInstall){deferredInstall.prompt();const r=await deferredInstall.userChoice;deferredInstall=null;$('#btn-install').hidden=true;render(false)}else tab('settings')},
  persist:async()=>{await requestPersist();let ok=false;try{ok=await navigator.storage.persisted()}catch(e){}toast(ok?'Your library is protected':'Your browser said no. Installing the app usually fixes this');render(false)},
  'clear-all':()=>dialog({title:'Clear library?',body:'Every song, cover and playlist will be deleted from this device. This can’t be undone.',ok:'Clear everything',danger:true,onOk:async()=>{P.el.pause();P.el.removeAttribute('src');await DB.clear();S.tracks.clear();S.playlists.clear();for(const u of S.coverURL.values())URL.revokeObjectURL(u);S.coverURL.clear();P.order=[];P.base=[];P.idx=-1;S.recents=[];ls.set('recents',[]);ls.set('session',null);changed();updateNP();tab('home');toast('Library cleared')}}),
  'q-jump':el=>{const i=+el.dataset.i;P.idx=i;loadCur(true);closeSheet()},
  'q-rm':async el=>{const i=+el.dataset.i;const id=P.order[i];P.order.splice(i,1);const bi=P.base.indexOf(id);if(bi>-1)P.base.splice(bi,1);if(i<P.idx)P.idx--;saveSession();swapSheet(queueHTML())},
};
async function setLike(t,on){t.fav=on;t.favAt=Date.now();await DB.put('tracks',t);changed();toast(on?'Added to Liked Songs':'Removed from Liked Songs');updateNP();if(['liked','home','library'].includes(S.view.name))render(false);else{renderSide();$$(`.row[data-id="${t.id}"]`).forEach(r=>{const b=r.querySelector('.like');if(b){b.classList.toggle('on',on);b.innerHTML=ico('heart',on)}})}}
function queueHTML(){
  const cur=P.cur();
  const up=P.order.slice(P.idx+1).map((id,j)=>({t:S.tracks.get(id),i:P.idx+1+j})).filter(x=>x.t).slice(0,150);
  const row=(t,i,isCur)=>`<div class="li ${isCur?'playing':''}" style="cursor:pointer" data-act="q-jump" data-i="${i}">${coverHTML(t.coverId,t.album||t.title)}<div class="li-b"><div class="li-t">${esc(t.title)}</div><div class="li-s">${esc(t.artist)}</div></div>${isCur?'':`<button class="icon-btn" data-act="q-rm" data-i="${i}" title="Remove">${ico('x')}</button>`}</div>`;
  return`<div class="sheet-head"><div class="t" style="font-family:var(--display);font-size:22px;font-weight:400;text-transform:uppercase">Queue</div></div>
  ${cur?`<div style="padding:4px 10px;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--gold);text-transform:uppercase">Now playing</div>${row(cur,P.idx,true)}`:''}
  <div style="padding:14px 10px 4px;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--mute);text-transform:uppercase">Next from: ${esc(P.from||'Library')}</div>
  ${up.length?up.map(x=>row(x.t,x.i,false)).join(''):`<div class="muted" style="padding:10px 12px">${P.repeat==='all'?'Repeat is on, so it starts again from the top.':'Nothing else queued.'}</div>`}`;
}
function openQueue(){openSheet(queueHTML())}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const f=A[el.dataset.act];if(!f)return;
  if(el.tagName==='A')e.preventDefault();
  e.stopPropagation();f(el,e);
});
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea'))return;
  if(e.key==='Enter'&&e.target.matches('[role=button]')){e.target.click();return}
  if(e.code==='Space'){e.preventDefault();toggle()}
  else if(e.key==='ArrowRight'&&!$('#imp-scrim').classList.contains('open'))seekBy(e.shiftKey?30:10);
  else if(e.key==='ArrowLeft'&&!$('#imp-scrim').classList.contains('open'))seekBy(e.shiftKey?-30:-10);
  else if(($('#imp-scrim').classList.contains('open'))&&(e.key==='ArrowRight'||e.key==='ArrowLeft'))setImpTab(impTab==='upload'?'recent':'upload');
  else if(e.key==='Escape'&&OV.length)popOv();
  else if(e.key.toLowerCase()==='n'&&e.shiftKey)next();
  else if(e.key.toLowerCase()==='p'&&e.shiftKey)prev();
});
document.addEventListener('keydown',e=>{if($('#imp-scrim').classList.contains('open')&&(e.key==='ArrowRight'||e.key==='ArrowLeft')&&!e.target.matches('input')){e.stopImmediatePropagation()}},true);

let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400)}

/* ---------------- Boot ---------------- */
(async function boot(){
  document.documentElement.dataset.accent=S.accent;
  await DB.open();
  try{
    const [tracks,covers,pls]=await Promise.all([DB.all('tracks'),DB.all('covers'),DB.all('playlists')]);
    for(const c of covers){if(c.blob){S.coverURL.set(c.id,URL.createObjectURL(c.blob));S.coverMime.set(c.id,c.blob.type)}}
    for(const t of tracks)S.tracks.set(t.id,t);
    for(const p of pls)S.playlists.set(p.id,p);
  }catch(e){console.warn(e)}
  changed();
  setVol(S.volume);setModeIcons();setPlayIcons();
  restoreSession();
  try{const st=history.state;if(st&&st.view&&!st.ov)S.view=st.view;history.replaceState({view:S.view},'')}catch(e){}
  render();
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
})();
</script>
